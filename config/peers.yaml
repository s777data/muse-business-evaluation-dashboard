# Sector peer groups (v4). Each subject maps to ONE group; the group's
# members drive (a) the peer-relative EV/S sub-score in Value, (b) the
# moat revenue_percentile sub-score, and (c) display-only percentile
# ranks for moat metrics in the run output.
# Members are US-listed SEC EDGAR filers with US-GAAP XBRL only — the
# engine reads their filings and a free price feed; a member whose EV/S
# cannot be computed drops out of the relative ranking (fail closed) and
# is reported in the run's peer_failures / data_quality.
# SK hynix and Samsung are MU's closest memory rivals but are EXCLUDED:
# they do not file with the SEC in a form the free EDGAR XBRL API covers,
# and no free keyless source covers them. See README "Known limits".
# GRAB has no group: it is an IFRS 20-F filer and is not scored at all.

# Minimum group size (subject + members with a computable EV/S) for the
# relative EV/S sub-score to be scored; below this it goes missing.
relative_ev_to_sales_min_group: 4

